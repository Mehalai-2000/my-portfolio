<section class="w-full min-h-screen flex flex-col justify-center bg-[var(--color-bg)] px-6 md:px-20 py-16">
  <div class="mx-auto w-full max-w-4xl bg-[var(--color-primary)] rounded-2xl p-6 md:p-10">

    <!-- Header -->
    <div class="mb-10 text-left max-w-3xl mx-auto">
      <p class="text-sm font-semibold tracking-wider text-white mb-1" style="font-family: 'DM Sans', sans-serif;">
        Get In Touch
      </p>

      <h2 class="text-3xl font-bold text-white" style="font-family: 'Poppins', sans-serif;">
        Contact Me
      </h2>

      <div class="mt-2 border-t-2 border-white w-16"></div>
    </div>

    <!-- Form -->
    <form class="w-full max-w-xl flex flex-col gap-4 mx-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input type="text" placeholder="Name" class="w-full p-3 rounded-md bg-white/10 text-white placeholder-white/70 border border-white/20 
                 focus:outline-none focus:ring-2 focus:ring-white" />
        <input type="email" placeholder="Email" class="w-full p-3 rounded-md bg-white/10 text-white placeholder-white/70 border border-white/20 
                 focus:outline-none focus:ring-2 focus:ring-white" />
        <input type="text" placeholder="Phone" class="w-full p-3 rounded-md bg-white/10 text-white placeholder-white/70 border border-white/20 
                 focus:outline-none focus:ring-2 focus:ring-white" />
        <input type="text" placeholder="Subject" class="w-full p-3 rounded-md bg-white/10 text-white placeholder-white/70 border border-white/20 
                 focus:outline-none focus:ring-2 focus:ring-white" />
      </div>

      <textarea placeholder="Message" rows="5" class="w-full p-3 rounded-md bg-white/10 text-white placeholder-white/70 border border-white/20 
               focus:outline-none focus:ring-2 focus:ring-white"></textarea>

      <button type="submit" class="w-fit flex items-center gap-2 px-6 py-3 rounded-full bg-white text-[var(--color-primary)] font-semibold 
               hover:bg-opacity-90 transition-transform duration-300 hover:scale-105">
        Send Message
      </button>
    </form>

  </div>
</section>
