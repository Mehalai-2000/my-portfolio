<section class="w-full min-h-screen flex flex-col justify-center bg-[var(--color-bg)] px-20 py-16">
  <div class="mx-auto w-full max-w-4xl bg-[var(--color-card)] border-2 border-[var(--color-accent)] p-10 shadow-md">

    <!-- Header -->
    <div class="mb-10 text-left max-w-3xl mx-auto">
      <p class="text-sm font-semibold tracking-wider text-[var(--color-accent)] mb-1"
        style="font-family: 'DM Sans', sans-serif;">
        Get In Touch
      </p>

      <h2 class="text-3xl font-bold text-[var(--color-text)]" style="font-family: 'Poppins', sans-serif;">
        Contact Me
      </h2>

      <div class="mt-2 border-t-2 border-[var(--color-accent)] w-16"></div>
    </div>

    <!-- Form -->
    <form class="w-full max-w-xl flex flex-col gap-4 mx-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input type="text" placeholder="Name" class="input-field" />
        <input type="email" placeholder="Email" class="input-field" />
        <input type="text" placeholder="Phone" class="input-field" />
        <input type="text" placeholder="Subject" class="input-field" />
      </div>

      <textarea placeholder="Message" rows="5" class="input-field"></textarea>

      <button
        class="self-start flex items-center gap-2 px-4 py-2 rounded-full bg-gradient-to-r from-[var(--color-primary)] to-[var(--color-accent)] text-white text-sm font-medium shadow-md hover:scale-105 hover:shadow-[var(--color-primary)] transition-transform duration-300">
        <lucide-icon name="download" class="w-4 h-4" />
        Send Message
      </button>
    </form>
  </div>
</section>
