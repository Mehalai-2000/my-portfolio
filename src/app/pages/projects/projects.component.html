<section class="w-full min-h-screen flex flex-col justify-center bg-[var(--color-bg)] px-6 md:px-20 py-16">

    <div class="w-full max-w-7xl mx-auto flex flex-col justify-center mb-0 text-left mt-10">
        <p class="text-sm font-bold text-[var(--color-accent)] reveal animate-right tracking-widest">
            My Creations
        </p>
        <div class="text-4xl font-bold text-[var(--color-primary)] text-left reveal animate-right delay-[200ms]">
            Latest Projects
            <div class="mt-3 border-t-2 border-[var(--color-accent)] w-20"></div>
        </div>
    </div>

    <div class="w-full flex flex-wrap justify-center gap-8 mt-10 pb-12">
        @for (project of projects; track project.title) {
        <div
            class="group relative w-full sm:w-[400px] bg-[#f8fafc] dark:bg-[#1e293b] rounded-2xl overflow-hidden shadow-md hover:shadow-2xl hover:shadow-teal-900/10 transition-all duration-500 hover:-translate-y-2 border border-slate-200 dark:border-slate-700 flex flex-col">

            <!-- Top Accent Line -->
            <div class="h-1.5 w-full bg-[var(--color-accent)]"></div>

            <!-- Image Section -->
            <div class="relative h-52 w-full overflow-hidden bg-slate-200">
                <img [src]="project.image" [alt]="project.title"
                    class="w-full h-full object-cover object-top transition-transform duration-700 group-hover:scale-110">

                <!-- Overlay with Button -->
                @if (project.link) {
                <div
                    class="absolute inset-0 bg-slate-900/20 backdrop-blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center z-10">
                    <a [href]="project.link" target="_blank"
                        class="px-6 py-2.5 bg-gradient-to-r from-teal-500 to-teal-700 text-white text-sm font-semibold rounded-full shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 hover:scale-105 hover:shadow-teal-500/30 flex items-center gap-2">
                        View Project
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-external-link">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                            <polyline points="15 3 21 3 21 9" />
                            <line x1="10" y1="14" x2="21" y2="3" />
                        </svg>
                    </a>
                </div>
                }
            </div>

            <!-- Content Section -->
            <div class="p-6 flex flex-col flex-grow relative">
                <h3
                    class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2 group-hover:text-teal-600 transition-colors">
                    {{project.title}}
                </h3>

                <p class="text-slate-600 dark:text-slate-400 text-sm leading-relaxed mb-4 line-clamp-3">
                    {{project.description}}
                </p>

                <!-- Tags / Tech -->
                <div class="mt-auto pt-4 border-t border-[var(--color-accent)]/20 flex flex-wrap gap-2">
                    @for (item of project.tech; track item) {
                    <span
                        class="px-3 py-1 text-[11px] font-bold tracking-wider uppercase bg-[#0d9488] text-white rounded-md transition-all duration-300 hover:bg-[#0f766e] hover:-translate-y-0.5 hover:shadow-lg cursor-default select-none shadow-md">
                        {{item}}
                    </span>
                    }
                </div>
            </div>
        </div>
        }
    </div>
</section>
