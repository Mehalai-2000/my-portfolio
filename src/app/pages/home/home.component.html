<!-- ═══════════════════════════════════════════════════════════════
     ULTRA-REALISTIC CINEMATIC HERO SECTION
     Background: Pure Black Studio (#000000)
     Left: Minimalist Portfolio Content (~45%)
     Right: Cinematic AI Character Studio Video (~55%)
     ═══════════════════════════════════════════════════════════════ -->
<div class="cinematic-hero" aria-label="Cinematic Hero Section">

  <!-- Subtle Warm Golden Ambient Studio Lighting -->
  <div class="ambient-gold-glow" aria-hidden="true"></div>

  <!-- Main Hero Grid (45% Content / 55% Character) -->
  <div class="hero-layout">

    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         LEFT SIDE — PORTFOLIO CONTENT (~45%)
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <div class="hero-content">

      <!-- Small elegant heading -->
      <p class="hero-salutation">HELLO, I'M</p>

      <!-- Large premium heading -->
      <h1 class="hero-name">
        RAMUMANIMEHALAI
      </h1>

      <!-- Professional title -->
      <h2 class="hero-title">
        ANGULAR / FRONTEND DEVELOPER
      </h2>

      <!-- Subtle separator -->
      <div class="gold-separator" aria-hidden="true"></div>

      <!-- Short description -->
      <p class="hero-description">
        "I build modern, responsive, and user-friendly web experiences with clean code and thoughtful design."
      </p>

      <!-- Action Buttons Row -->
      <div class="hero-actions">
        <!-- Primary Button: VIEW MY WORK -->
        <a href="#projects" class="btn-primary" (click)="scrollTo('projects', $event)">
          <span>VIEW MY WORK</span>
          <svg width="14" height="14" style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </a>

        <!-- Secondary Button: TALK TO ME -->
        <button type="button" class="btn-talk" [class.btn-talk--active]="isTalkPlaying" [disabled]="isTalkPlaying"
          (click)="onTalkButtonClick()" [attr.aria-label]="talkButtonLabel" [attr.aria-pressed]="isTalkPlaying">

          <!-- Audio Wave / Mic Icon -->
          <span class="btn-talk__icon" aria-hidden="true">
            @if (isTalkPlaying) {
            <!-- Animated Audio Waves -->
            <span class="audio-wave">
              <span></span><span></span><span></span><span></span>
            </span>
            } @else {
            <!-- Mic Icon -->
            <svg width="14" height="14" style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z" />
              <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
              <line x1="12" y1="19" x2="12" y2="22" />
            </svg>
            }
          </span>

          <span>{{ talkButtonLabel }}</span>
        </button>
      </div>

      <!-- Social Media Links -->
      <div class="hero-socials">
        <a href="https://www.linkedin.com/in/ramumanimehalai1111/" target="_blank" rel="noopener noreferrer"
          class="social-link" aria-label="LinkedIn">
          <svg width="16" height="16" style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
          </svg>
        </a>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
          <svg width="16" height="16" style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5c.5.08.66-.17.66-.48c0-.23-.01-.84-.01-1.65c-2.79.6-3.38-1.35-3.38-1.35c-.45-1.15-1.11-1.46-1.11-1.46c-.91-.62.07-.6.07-.6c1 .07 1.53 1.03 1.53 1.03c.89 1.52 2.34 1.08 2.91.83c.09-.65.35-1.09.63-1.34c-2.22-.25-4.55-1.11-4.55-4.92c0-1.11.38-2 1.03-2.71c-.1-.25-.45-1.29.1-2.64c0 0 .84-.27 2.75 1.02c.79-.22 1.65-.33 2.5-.33c.85 0 1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02c.55 1.35.2 2.39.1 2.64c.65.71 1.03 1.6 1.03 2.71c0 3.82-2.34 4.66-4.57 4.91c.36.31.69.92.69 1.85c0 1.34-.01 2.42-.01 2.74c0 .31.16.57.67.48A10 10 0 0 0 22 12A10 10 0 0 0 12 2z" />
          </svg>
        </a>
      </div>

    </div>

    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         RIGHT SIDE — CINEMATIC CHARACTER (~55%)
         Original AI-generated cinematic footage
         Seamlessly blending into the pure black backdrop
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
    <div class="hero-character-stage" (click)="onStageClick()">

      <!-- ── MAIN VIDEO: Autoplays muted, freezes on last seated frame ── -->
      <video #mainVideo class="cinematic-video" src="/videos/portfolio_main.mp4" muted playsinline preload="auto"
        disablePictureInPicture [attr.aria-label]="'Introduction video of Ramumanimehalai'">
      </video>

      <!-- ── TALK VIDEO: Plays with English audio on Talk to Me click ── -->
      <video #talkVideo class="cinematic-video video-hidden" src="/videos/portfolio_talk.mp4" playsinline preload="auto"
        disablePictureInPicture [attr.aria-label]="'Audio introduction video of Ramumanimehalai'">
      </video>

      <!-- Tap to Play prompt if browser blocks initial muted autoplay -->
      @if (showPlayHint) {
      <div class="autoplay-hint" aria-live="polite">
        <div class="play-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
        </div>
        <span>TAP TO PLAY</span>
      </div>
      }

    </div>

  </div>

  <!-- Subtle Minimalist Scroll Indicator -->
  <a href="#about" class="hero-scroll" (click)="scrollTo('about', $event)" aria-label="Scroll to content">
    <span class="scroll-label">SCROLL</span>
    <div class="scroll-track">
      <div class="scroll-dot"></div>
    </div>
  </a>

</div>
