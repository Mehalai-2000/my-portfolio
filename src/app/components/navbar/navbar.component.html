<!-- ═══════════════════════════════════════════════════════════════
     PREMIUM CINEMATIC FLOATING NAVIGATION BAR
     Aesthetic: Pure Black Studio & Warm Champagne Gold (#D6B477)
     Layout: Brand Logo (RM) on LEFT · Navigation Menu on RIGHT
     ═══════════════════════════════════════════════════════════════ -->

<header class="cinematic-header" [class.is-scrolled]="isScrolled" role="banner">
  <div class="header-container">

    <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         LEFT SIDE: Minimal Brand Logo "RM"
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
      <a href="#home" class="brand-logo" (click)="scrollTo('home', $event)" aria-label="Ramumanimehalai M - Home">
        <span class="logo-mark">
          <span class="logo-r">R</span>
          <span class="logo-m">M</span>
        </span>
        <span class="logo-accent-dot" aria-hidden="true"></span>
      </a>

      <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
         RIGHT SIDE: Floating Pill Navigation Menu (Desktop)
                     + Mobile Hamburger Toggle (Mobile / Tablet)
         ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
      <div class="header-right">

        <!-- Modern Floating Pill Navigation Menu -->
        <nav class="nav-pill-wrapper" aria-label="Primary Navigation">
          <ul class="nav-pill-list" role="menubar">
            <li *ngFor="let item of navItems" role="none">
              <a [href]="'#' + item.id" role="menuitem" class="nav-pill-link" [class.active]="activeSection === item.id"
                [attr.aria-current]="activeSection === item.id ? 'page' : null" (click)="scrollTo(item.id, $event)">
                <span class="nav-label">{{ item.label }}</span>
                <span class="nav-active-indicator" aria-hidden="true"></span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Mobile Hamburger Toggle Button -->
        <button type="button" class="mobile-toggle-btn" [class.is-open]="isMobileMenuOpen" (click)="toggleMobileMenu()"
          [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle navigation menu">
          <span class="toggle-bar"></span>
          <span class="toggle-bar"></span>
        </button>

      </div>

    </div>
</header>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     MOBILE NAVIGATION DRAWER & BACKDROP
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<div class="mobile-drawer-backdrop" [class.is-open]="isMobileMenuOpen" (click)="closeMobileMenu()" aria-hidden="true">
</div>

<aside class="mobile-drawer" [class.is-open]="isMobileMenuOpen" [attr.aria-hidden]="!isMobileMenuOpen" role="dialog"
  aria-label="Mobile Navigation">

  <!-- Mobile Drawer Header -->
  <div class="drawer-header">
    <a href="#home" class="brand-logo" (click)="scrollTo('home', $event)">
      <span class="logo-mark">
        <span class="logo-r">R</span>
        <span class="logo-m">M</span>
      </span>
      <span class="logo-accent-dot" aria-hidden="true"></span>
    </a>

    <button type="button" class="drawer-close-btn" (click)="closeMobileMenu()" aria-label="Close navigation menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Mobile Navigation Links -->
  <nav class="drawer-nav">
    <ul class="drawer-nav-list">
      <li *ngFor="let item of navItems; let i = index">
        <a [href]="'#' + item.id" class="drawer-nav-link" [class.active]="activeSection === item.id"
          (click)="scrollTo(item.id, $event)">
          <span class="drawer-nav-num">0{{ i + 1 }}</span>
          <span class="drawer-nav-text">{{ item.label }}</span>
          <svg class="drawer-nav-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>
      </li>
    </ul>
  </nav>

</aside>
