<!-- ═══════════════════════════════════════════════════════════════
     CINEMATIC HERO INTRO ANIMATION
     1. Pure Black (#000000) Cinematic Background
     2. Confident Center Walking Animation toward Camera (Frame 70 to 142)
     3. Natural Center Poised Stop
     4. Sequential Golden Cinematic Name Reveal: "RAMUMANIMEHALAI"
     5. Smooth Cinematic Role Reveal: "ANGULAR / FRONTEND DEVELOPER"
     6. Strict Identity Preservation & Seamless Dissolve into Hero
     ═══════════════════════════════════════════════════════════════ -->

<div class="cinematic-intro-overlay" #introOverlay (click)="skipIntro()" [class.is-hidden]="isFinished"
  role="presentation" aria-label="Portfolio Cinematic Introduction">

  <!-- Ambient Subtle Golden & Emerald Lighting -->
  <div class="intro-aura intro-aura--center" #ambientAura aria-hidden="true"></div>
  <div class="intro-aura intro-aura--emerald" aria-hidden="true"></div>

  <!-- Walking Animation Canvas Stage (Dead Center) -->
  <div class="intro-canvas-stage">
    <canvas #walkCanvas class="intro-walk-canvas" width="1920" height="1080"></canvas>
  </div>

  <!-- Cinematic Vignette for Depth & Focus -->
  <div class="intro-vignette" aria-hidden="true"></div>

  <!-- Central Typography Showcase Stage -->
  <div class="intro-title-stage" #titleStage>

    <!-- Eyebrow Tag -->
    <div class="intro-eyebrow" #eyebrowPill aria-hidden="true">
      <span class="eyebrow-line"></span>
      <span class="eyebrow-text">PORTFOLIO</span>
      <span class="eyebrow-line"></span>
    </div>

    <!-- Name: RAMUMANIMEHALAI (Sequential Golden Letter Animation) -->
    <h1 class="intro-name" #nameContainer aria-label="Ramumanimehalai">
      @for (char of nameChars; track $index) {
        <span class="intro-char" [attr.data-char]="char">{{ char }}</span>
      }
    </h1>

    <!-- Golden Flare Sweep across typography -->
    <div class="intro-gold-flare" #goldFlare aria-hidden="true"></div>

    <!-- Role: ANGULAR / FRONTEND DEVELOPER -->
    <div class="intro-role" #roleContainer aria-label="Angular / Frontend Developer">
      <span class="intro-role-text">ANGULAR / FRONTEND DEVELOPER</span>
    </div>

  </div>

  <!-- Minimalist Skip Button -->
  <button class="intro-skip-btn" type="button" (click)="skipIntro(); $event.stopPropagation()" aria-label="Skip introduction">
    <span>SKIP INTRO</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="5 4 15 12 5 20 5 4"></polygon>
      <line x1="19" y1="5" x2="19" y2="19"></line>
    </svg>
  </button>

</div>
